# Alembic configuration.
#
# The database URL is intentionally left blank here: `migrations/env.py` reads it
# from `app.core.config.settings.DATABASE_URL` so there is exactly one place that
# knows how to reach the database. Override it for a one-off command with
#
#     alembic -x db_url=postgresql+asyncpg://... upgrade head
#
# The script directory is `migrations/` rather than `alembic/` on purpose: a
# local directory named `alembic` would sit next to the installed `alembic`
# package on sys.path and make `import alembic` ambiguous.

[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os

# Sequential, descriptive revision filenames: 0001_initial_schema.py, ...
# Deliberately not the default timestamped template, so the versions directory
# reads in the same order as the schema history regardless of file mtime.
file_template = %%(rev)s_%%(slug)s

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
