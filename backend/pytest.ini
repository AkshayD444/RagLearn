[pytest]
# Make `app` and `tests` importable no matter which directory pytest is invoked from.
pythonpath = .
testpaths = tests

# `auto` lets new async tests run without repeating the marker, while existing
# `@pytest.mark.asyncio` tests keep working unchanged.
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Markers
markers =
    postgres: integration tests that need a live PostgreSQL + pgvector instance.
        Skipped automatically unless TEST_DATABASE_URL points at a postgresql database.

addopts = -ra --strict-markers
